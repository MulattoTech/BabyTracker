name: babytracker

# Canonical BabyTracker application with the existing authoritative data volumes.
# Build from this repository; never replace or delete production volumes.
services:
  sprout:
    image: ${BABYTRACKER_IMAGE:-babytracker:local}
    build:
      context: ./application
      args:
        ENABLE_NOTIFICATIONS: "true"
        DATABASE_PROVIDER: sqlite
    container_name: babytracker-sprout
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: selfhosted
      DATABASE_PROVIDER: sqlite
      TZ: ${TZ:-America/Chicago}
      ENABLE_NOTIFICATIONS: "true"
      BABYTRACKER_OCR_ENABLED: ${BABYTRACKER_OCR_ENABLED:-true}
      APP_URL: ${APP_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      # No public/LAN HTTP listener. Tailscale Serve provides private HTTPS.
      - "127.0.0.1:${BABYTRACKER_PORT:-3123}:3000"
    volumes:
      - sprout-db:/db
      - sprout-env:/app/env
      - sprout-files:/app/Files
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  sprout-db:
    name: babytracker-sprout-db
  sprout-env:
    name: babytracker-sprout-env
  sprout-files:
    name: babytracker-sprout-files