name: babytracker

# Phase 0: one authoritative activity store (Sprout Track), not two competing databases.
# All extensions will integrate through stable boundaries instead of patching the running image.
services:
  sprout:
    image: ${SPROUT_IMAGE:-sprouttrack/sprout-track:1.6.7}
    container_name: babytracker-sprout
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: selfhosted
      DATABASE_PROVIDER: sqlite
      TZ: ${TZ:-America/Chicago}
      ENABLE_NOTIFICATIONS: "true"
      APP_URL: ${APP_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      # No public/LAN HTTP listener. Tailscale Serve provides private HTTPS.
      - "127.0.0.1:${BABYTRACKER_PORT:-3123}:3000"
    volumes:
      - sprout-db:/db
      - sprout-env:/app/env
      - sprout-files:/app/Files
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  sprout-db:
    name: babytracker-sprout-db
  sprout-env:
    name: babytracker-sprout-env
  sprout-files:
    name: babytracker-sprout-files