name: BabyTracker operations contracts
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/ops -v
      - run: python scripts/modules.py list
      - name: Parse PowerShell operations scripts without executing them
        shell: pwsh
        run: |
          $failed=$false
          foreach($p in Get-ChildItem scripts -Filter *.ps1){
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile($p.FullName,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$failed=$true;Write-Error "Parse errors: $($p.Name)"}
          }
          if($failed){exit 1}
