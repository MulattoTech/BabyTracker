name: Validate BabyTracker deployment
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Verify that private setup cannot publish LAN port
        shell: bash
        run: |
          docker compose --env-file .env.example config | grep -q 'host_ip: 127.0.0.1'
      - name: Verify no tracked secrets
        shell: bash
        run: |
          test ! -f .env
          test -f .gitignore